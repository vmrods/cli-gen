name: CI

# GitHub mirror of azure-pipelines.yml: the same checks on hosted runners.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published RustSec advisory fails the build without a commit.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml, so CI uses the pinned toolchain.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast: report every failing test target, not just the first.
      - run: cargo test --workspace --locked --no-fail-fast

  supply-chain:
    name: advisories, licenses, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
