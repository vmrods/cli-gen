openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
  description: Sample pet store used by OpenCLI tests.
servers:
  - url: https://{region}.petstore.example.com/v1
    variables:
      region:
        default: eu
security:
  - apiKey: []
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of pets
    post:
      operationId: createPet
      summary: Create a pet
      requestBody:
        $ref: '#/components/requestBodies/NewPet'
      security:
        - oauth: ['pets:write']
      responses:
        '201':
          description: Created
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: showPetById
      summary: Info for a specific pet
      responses:
        '200':
          description: The pet
    delete:
      operationId: deletePet
      deprecated: true
      security: []
      responses:
        '204':
          description: Deleted
components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of pets to return
      schema:
        type: integer
        format: int32
        maximum: 100
  requestBodies:
    NewPet:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewPet'
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        tag:
          type: string
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
        tag:
          type: string
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-API-Key
      in: header
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    basic:
      type: http
      scheme: basic
    oauth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/token
          scopes:
            pets:write: Modify pets
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/token
          scopes:
            pets:write: Modify pets
