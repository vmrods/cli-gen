swagger: '2.0'
info:
  title: Petstore
  version: 1.0.0
  description: Sample pet store used by OpenCLI tests.
host: eu.petstore.example.com
basePath: /v1
schemes: [https]
consumes: [application/json]
produces: [application/json]
security:
  - apiKey: []
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      parameters:
        - $ref: '#/parameters/Limit'
      responses:
        '200':
          description: A page of pets
          schema:
            type: array
            items:
              $ref: '#/definitions/Pet'
    post:
      operationId: createPet
      summary: Create a pet
      parameters:
        - name: pet
          in: body
          required: true
          schema:
            $ref: '#/definitions/NewPet'
      security:
        - oauth: ['pets:write']
      responses:
        '201':
          description: Created
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        type: string
    get:
      operationId: showPetById
      summary: Info for a specific pet
      responses:
        '200':
          description: The pet
    delete:
      operationId: deletePet
      deprecated: true
      security: []
      responses:
        '204':
          description: Deleted
parameters:
  Limit:
    name: limit
    in: query
    required: false
    description: Maximum number of pets to return
    type: integer
    format: int32
    maximum: 100
definitions:
  Pet:
    type: object
    required: [id, name]
    properties:
      id:
        type: string
      name:
        type: string
      tag:
        type: string
  NewPet:
    type: object
    required: [name]
    properties:
      name:
        type: string
      tag:
        type: string
securityDefinitions:
  apiKey:
    type: apiKey
    name: X-API-Key
    in: header
  basic:
    type: basic
  oauth:
    type: oauth2
    flow: application
    tokenUrl: https://auth.example.com/token
    scopes:
      pets:write: Modify pets
