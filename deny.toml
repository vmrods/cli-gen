[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" only because these crates were merged into zbus 6; they carry
# no known vulnerability. keyring's Linux Secret Service store still pins
# zbus 5. Remove once `secret-service` moves to zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; pulled in by keyring's Secret Service store" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; pulled in by keyring's Secret Service store" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; pulled in by keyring's Secret Service store" },
    # sqlx 0.9.0, the latest release, pins libsqlite3-sys 0.37 and its bundled
    # SQLite. Remove once sqlx moves to libsqlite3-sys 0.39 or newer.
    { id = "RUSTSEC-2026-0459", reason = "needs a crafted database and -wal file pair; OpenCLI opens only its own database in the user's data directory" },
]

[licenses]
version = 2
confidence-threshold = 0.9
private = { ignore = true }
# The allow-list is policy for future dependencies, not an inventory of current ones.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# Remaining duplicates come from version skew between upstream crates (e.g. sqlx
# and reqwest pin different base64 majors); we can't resolve them from here.
multiple-versions = "allow"
wildcards = "deny"
# Workspace path dependencies are fine: no crate here is published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
