[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
private = { ignore = true }
# The allow-list is policy for future dependencies, not an inventory of current ones.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# Remaining duplicates come from version skew between upstream crates (e.g. sqlx
# and reqwest pin different base64 majors); we can't resolve them from here.
multiple-versions = "allow"
wildcards = "deny"
# Workspace path dependencies are fine: no crate here is published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
