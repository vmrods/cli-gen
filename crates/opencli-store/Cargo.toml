[package]
name = "opencli-store"
description = "SQLite metadata store for imported OpenCLI specifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
opencli-core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "migrate", "macros", "time"] }
thiserror.workspace = true
time = { workspace = true, features = ["serde-well-known"] }

[lints]
workspace = true

[dev-dependencies]
opencli-spec.workspace = true
sqlx = { workspace = true, features = ["migrate", "runtime-tokio", "sqlite"], default-features = false }
tempfile.workspace = true
time = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
