[package]
name = "opencli"
description = "Specification-driven CLI that turns imported OpenAPI documents into commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
clap_complete.workspace = true
directories.workspace = true
indicatif.workspace = true
miette = { workspace = true, features = ["fancy"] }
opencli-auth.workspace = true
opencli-core.workspace = true
opencli-plugin.workspace = true
opencli-runtime.workspace = true
opencli-spec.workspace = true
opencli-store.workspace = true
owo-colors = { workspace = true, features = ["supports-colors"] }
reqwest = { workspace = true, features = ["rustls"] }
rpassword.workspace = true
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "macros"] }
tokio = { workspace = true, features = ["macros", "rt", "fs", "io-std", "io-util", "process"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
rstest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true

[lints]
workspace = true
