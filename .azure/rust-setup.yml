steps:
  # Hosted agents ship rustup; this installs the toolchain pinned in rust-toolchain.toml.
  # CARGO_HOME stays at rustup's default: moving it makes rustup fail with
  # "rustup is not installed at <CARGO_HOME>".
  - script: rustup toolchain install
    displayName: Install pinned toolchain
  # The registry path differs per OS (~/.cargo or %USERPROFILE%\.cargo).
  - pwsh: |
      $registry = [IO.Path]::Combine($HOME, '.cargo', 'registry')
      Write-Host "##vso[task.setvariable variable=CARGO_REGISTRY]$registry"
    displayName: Locate cargo registry
  # Registry and build output survive between runs; keyed on the toolchain and
  # lockfile so a dependency change starts clean.
  - task: Cache@2
    displayName: Cache cargo registry
    inputs:
      key: 'cargo-registry | "$(Agent.OS)" | Cargo.lock'
      restoreKeys: |
        cargo-registry | "$(Agent.OS)"
      path: $(CARGO_REGISTRY)
  - task: Cache@2
    displayName: Cache build output
    inputs:
      key: 'target | "$(Agent.OS)" | "$(Agent.JobName)" | rust-toolchain.toml | Cargo.lock'
      restoreKeys: |
        target | "$(Agent.OS)" | "$(Agent.JobName)" | rust-toolchain.toml
      path: $(CARGO_TARGET_DIR)
