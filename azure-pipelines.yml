# CI is on demand, not per push: builds cost agent minutes and take time.
#
# - Pull requests: add a build-validation policy on `main` pointing at this
#   pipeline to run it as a PR check (Azure Repos ignores the `pr:` key).
# - Manual: queue a run; tick "full matrix" to include macOS and Windows.
# - Weekly: the full matrix on `main`, even without changes, because new
#   RustSec advisories appear on their own.
#
# A default run is one Linux job on the self-hosted pool: fmt, clippy,
# dependency audit, and the test suite run once under coverage.
trigger: none
pr: none

schedules:
  - cron: "0 6 * * 1"
    displayName: Weekly full check
    branches:
      include: [main]
    always: true

parameters:
  - name: fullMatrix
    displayName: Full matrix (also build and test on macOS and Windows)
    type: boolean
    default: false

variables:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  CARGO_TARGET_DIR: $(Pipeline.Workspace)/target

jobs:
  - job: Linux
    displayName: Linux (fmt, clippy, audit, tests with coverage)
    # Self-hosted: no hosted-agent minutes. The checks run in Docker with the
    # toolchain pinned in rust-toolchain.toml (see .azure/ci.Dockerfile).
    pool: SelfHosted-K8s
    timeoutInMinutes: 60
    steps:
      - script: |
          set -euo pipefail
          version="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          docker build --progress=plain --target check \
            --build-arg RUST_VERSION="$version" --build-arg RUN_ID="$(Build.BuildId)" \
            -f .azure/ci.Dockerfile .
        displayName: Format, clippy, audit, tests with coverage (>= 80% lines)

  - ${{ if or(parameters.fullMatrix, eq(variables['Build.Reason'], 'Schedule')) }}:
      - job: Platforms
        displayName: Build and test
        strategy:
          matrix:
            macos: { image: macOS-15 }
            windows: { image: windows-2025 }
        pool:
          vmImage: $(image)
        steps:
          - template: .azure/rust-setup.yml
          - script: cargo clippy --workspace --all-targets --locked -- -D warnings
            displayName: Clippy
          # --no-fail-fast: report every failing test target, not just the first.
          - script: cargo test --workspace --locked --no-fail-fast
            displayName: Test
