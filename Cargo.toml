[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
argon2 = "0.6.0"
assert_cmd = "2.2.2"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive", "string"] }
clap_complete = "4.6.11"
directories = "6.0.0"
getrandom = "0.4.3"
indicatif = "0.18.6"
keyring = "4.2.0"
miette = "7.6.0"
openapiv3 = "2.2.0"
opencli-auth = { path = "crates/opencli-auth" }
opencli-core = { path = "crates/opencli-core" }
opencli-plugin = { path = "crates/opencli-plugin" }
opencli-runtime = { path = "crates/opencli-runtime" }
opencli-spec = { path = "crates/opencli-spec" }
opencli-store = { path = "crates/opencli-store" }
owo-colors = "4.4.0"
percent-encoding = "2.3.2"
predicates = "3.1.4"
reqwest = { version = "0.13.5", default-features = false }
rpassword = "7.5.4"
rstest = "0.28.0"
secrecy = "0.10.3"
serde = "1.0.229"
serde-saphyr = "2.1.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_path_to_error = "0.1.20"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.55"
tokio = "1.54.1"
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stderr = "warn"
todo = "warn"
